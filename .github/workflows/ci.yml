name: CI

on:
  pull_request:
  push:
    branches: [main, feat/multi-user-web-v1]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///ci.sqlite3
      DATA_DIR: ${{ github.workspace }}/data-ci
      UPLOAD_DIR: ${{ github.workspace }}/data-ci/uploads
      CODEX_BIN: python3
      ALLOWED_HOSTS: testserver,127.0.0.1,localhost
      SESSION_SECRET: ci-not-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests
      - run: pytest
      - run: alembic -c alembic.ini upgrade head
      - run: alembic -c alembic.ini upgrade head
      - run: bash -n scripts/install.sh scripts/update.sh scripts/backup.sh scripts/deployment_smoke.sh
      - run: scripts/deployment_smoke.sh
      - run: python -m jobs_catcher.smoke
      - run: bash scripts/check-no-runtime-artifacts.sh
