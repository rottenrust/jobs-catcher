{% extends "base.html" %}{% block body %}<h1>Admin Settings</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label>Enabled sources <input name="enabled_sources" value="{{ enabled_sources }}"></label><label>Min interval <input name="min_schedule_interval_days" value="{{ min_schedule_interval_days }}"></label><label>Max interval <input name="max_schedule_interval_days" value="{{ max_schedule_interval_days }}"></label><label>Timezone <input name="timezone" value="{{ timezone|default('Europe/Moscow') }}"></label><label>HTTP delay <input name="http_delay_seconds" value="{{ http_delay_seconds }}"></label><label>HTTP jitter <input name="http_jitter_seconds" value="{{ http_jitter_seconds }}"></label><label>HTTP timeout <input name="http_timeout_seconds" value="{{ http_timeout_seconds }}"></label><label>HTTP retries <input name="http_retries" value="{{ http_retries }}"></label><label>Max queries <input name="max_search_queries" value="{{ max_search_queries }}"></label><label>Max results/source <input name="max_results_per_source" value="{{ max_results_per_source }}"></label><label>Max vacancies/run <input name="max_vacancies_per_run" value="{{ max_vacancies_per_run }}"></label><label>Max LLM candidates <input name="max_llm_candidates" value="{{ max_llm_candidates }}"></label><label>Codex batch size <input name="codex_batch_size" value="{{ codex_batch_size }}"></label><label>Codex bin <input name="codex_bin" value="{{ codex_bin }}"></label><label>Resume limit <input name="resume_size_limit" value="{{ resume_size_limit }}"></label><label>Retention days <input name="artifact_retention_days" value="{{ artifact_retention_days }}"></label><label><input type="checkbox" name="global_search_enabled" {% if global_search_enabled %}checked{% endif %}> Global search enabled</label><button>Save</button></form>{% endblock %}
